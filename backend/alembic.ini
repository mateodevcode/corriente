# === Configuración de Alembic (migraciones versionadas) ===

[alembic]
# Ruta al directorio de migraciones
script_location = alembic
# URL se toma de variable de entorno DATABASE_URL en env.py (no se hardcodea aquí)
sqlalchemy.url =

# Formato de nombres de archivos de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Comparación de tipos de columna (para autogenerar con precisión)
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
